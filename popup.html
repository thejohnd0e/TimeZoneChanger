<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TimeZone Changer</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <h1>TimeZone Changer</h1>
        <div class="card">
            <div class="info-row">
                <span class="label">IP timezone:</span>
                <span id="timezone" class="value">Loading...</span>
            </div>
            <div class="info-row">
                <span class="label">Location:</span>
                <span id="location" class="value">Loading...</span>
            </div>
            <div class="info-row">
                <span class="label">IP:</span>
                <span id="ip" class="value">Loading...</span>
            </div>
            <div class="info-row">
                <span class="label">Last Update:</span>
                <span id="last-update" class="value">--</span>
            </div>
        </div>

        <div class="card">
            <div class="section-title">Current Site</div>
            <div class="info-row"><span class="label">Effective timezone:</span><span id="effective-timezone" class="value">-</span></div>
            <div class="info-row"><span class="label">Rule source:</span><span id="rule-source" class="value">-</span></div>
            <div class="info-row">
                <span class="label">Host:</span>
                <span id="current-host" class="value">-</span>
            </div>
            <div class="info-row">
                <span class="label">Mode:</span>
                <span id="current-mode" class="value">-</span>
            </div>
            <p id="page-message" class="hint" role="status">Loading current page...</p>
        </div>

        <div class="card">
            <div class="section-title">Quick rule</div>
            <label class="field-label" for="rule-scope">Apply to</label>
            <select id="rule-scope" disabled aria-describedby="scope-hint">
                <option value="site">This site</option>
                <option value="tab">This tab only</option>
            </select>
            <label class="field-label" for="rule-mode">Mode</label>
            <select id="rule-mode" disabled>
                <option value="inherit">Use inherited policy</option>
                <option value="auto">Auto by IP</option>
                <option value="disable">Do not spoof</option>
                <option value="fixed">Fixed timezone</option>
            </select>
            <label id="timezone-label" class="field-label" for="rule-timezone" hidden>Timezone</label>
            <input id="rule-timezone" type="text" placeholder="America/New_York" disabled hidden>
            <p id="scope-hint" class="hint"></p>
            <button id="apply-rule-btn" disabled>Apply and reload</button>
        </div>

        <div class="actions">
            <p id="status-message" role="status" aria-live="polite"></p>
            <button id="refresh-btn">Refresh IP/Timezone</button>
            <button id="open-options-btn" class="secondary-btn">All rules and exclusions</button>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
